[project]
name = "tquality-py-selenium"
dynamic = ["version"]
description = "Selenium integration for the tquality test automation framework, built on tquality-py-core."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "testing",
    "test-automation",
    "qa",
    "selenium",
    "webdriver",
    "page-object",
    "allure",
    "tquality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
    "Typing :: Typed",
]
dependencies = [
    "tquality-py-core[screencast]>=0.2.4",
    "selenium>=4.44.0",
    "pydantic==2.13.4",
    "static-dependency-injector>=0.3.8",
    "undetected-chromedriver>=3.5",
    "setuptools>=60",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.3",
    "cssselect>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/Tquality-ru/tquality-py-selenium"
Repository = "https://github.com/Tquality-ru/tquality-py-selenium"
Issues = "https://github.com/Tquality-ru/tquality-py-selenium/issues"
Changelog = "https://github.com/Tquality-ru/tquality-py-selenium/blob/master/CHANGELOG.md"

[project.scripts]
tquality-selenium-config = "tquality_selenium.cli:main"

[project.entry-points.pytest11]
tquality_selenium_page_source = "tquality_selenium.page_source_plugin"

[dependency-groups]
dev = [
    "ty>=0.0.54",
    "pytest-timeout>=2.3",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Версия берется из последнего git-тега вида vX.Y.Z.
# Сборка вне git-репо (например, из sdist) возьмет версию из PKG-INFO.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "only-version"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_selenium"]

# В sdist кладем только источники и документацию.
# Иначе CI-артефакты (.uv-cache, .venv) засасываются со внешними симлинками.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "schema",
    "scripts",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest]
# 120 секунд должно с запасом покрывать любой smoke (поднять браузер +
# открыть data-URL); если тест висит дольше - почти наверняка проблема
# в окружении/драйвере, а не в логике, и job упирается в долгий timeout.
# Нативная таблица типизирует значения; timeout у pytest-timeout - строковый ini.
timeout = "120"
timeout_method = "thread"
markers = [
    "macos: тесты требуют macOS-runner (все 5 браузеров установлены)",
    "windows: тесты требуют Windows",
    "linux: тесты требуют Linux",
    "chrome: тесты требуют установленный Chrome",
    "firefox: тесты требуют установленный Firefox",
    "edge: тесты требуют установленный Edge",
    "safari: тесты требуют установленный Safari (только macOS)",
    "undetected: тесты требуют undetected-chromedriver и Chrome",
]

[tool.ty.environment]
python-version = "3.12"

# error-on-warning держит проверку строгой, как mypy strict: любые
# предупреждения (в т.ч. неиспользуемые `ty: ignore`) роняют проверку.
# pydantic v2 ty понимает нативно через dataclass_transform - плагин не нужен.
[tool.ty.terminal]
error-on-warning = true

# Аналог mypy ignore_missing_imports: пакеты без аннотаций/стабов не
# считаются ошибкой разрешения импорта.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "undetected_chromedriver",
    "undetected_chromedriver.**",
    "PIL",
    "PIL.**",
    "imageio",
    "imageio.**",
]

[tool.ty.rules]
# Каждый переопределяющий метод обязан нести `@typing.override` - явный
# override ловит рассинхрон с базовым классом (опечатка в имени, ушедшая
# сигнатура) на этапе проверки типов.
missing-override-decorator = "error"

[tool.ruff]
exclude = [".*", "__pycache__"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
